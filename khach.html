<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thẻ thành viên GIANG Hair</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1c1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thẻ GIANG">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--nen:#f7f1ea;--the:#fffaf4;--chu:#2b2420;--mo:#8a7d72;--nau:#8a4b2f;--nau2:#b0704c;--vang:#d4a94f;--do:#b4506a;--vien:#eadfd3;--xanh:#2f7a43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom));min-height:100vh}
header{background:#1c1a17;color:#f3e7d3;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;text-align:center}
header img{height:40px;filter:invert(1) sepia(.3) brightness(1.05)}
main{max-width:480px;margin:0 auto;padding:0 14px}
h2{font:600 20px/1.3 Georgia,"Times New Roman",serif;color:var(--nau);margin:18px 0 6px}
h3{font:600 16px Georgia,serif;color:var(--nau);margin:18px 0 6px}
p{margin:6px 0}
.mo{color:var(--mo);font-size:14px}
.giua{text-align:center}
.the{margin-top:14px;border-radius:18px;padding:16px 18px;background:#1c1a17;color:#f3e7d3;position:relative;overflow:hidden}
.the:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(212,169,79,.18)}
.the .nho{font-size:12.5px;color:#cbbfae;letter-spacing:.3px}
.the .ma{font:600 15px Georgia,serif;color:#f6dc95}
.the .sodu{font:700 32px/1.15 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:8px 0 2px;color:#fff}
.hap{margin-top:10px;background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cham{display:inline-block;width:14px;height:14px;border-radius:50%;background:#d9cfc4;margin-left:5px;vertical-align:-2px}
.cham.on{background:var(--xanh)}
.nut2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;cursor:pointer}
.b{display:block;width:100%;border:0;border-radius:13px;padding:13px 10px;font-weight:600;font-size:16px;background:#fff;color:var(--chu);border:1.5px solid var(--vien)}
.b.chinh{background:var(--nau);color:#fff;border-color:var(--nau)}
.b.xanh{background:var(--xanh);color:#fff;border-color:var(--xanh)}
.b:disabled{opacity:.5}
.b + .b{margin-top:8px}
.lk{background:none;border:0;color:var(--nau);text-decoration:underline;padding:6px;font-size:14px}
.gd{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:2px 14px}
.gd div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px dashed var(--vien);font-size:15px}
.gd div:first-child{border-top:0}
.gd small{display:block;color:var(--mo);font-size:12px}
.am{color:#a3401f;font-weight:600;white-space:nowrap}.duong{color:var(--xanh);font-weight:600;white-space:nowrap}
.bao{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14.5px;background:#fff6df;border:1px solid #f0dba6}
.bao.xau{background:#fdeee9;border-color:#f2c9bb}
.bao .lk{padding:2px 0 0}
input.pin{display:block;width:100%;font:600 28px/1 -apple-system,Roboto,Arial;letter-spacing:14px;text-align:center;padding:12px;border:1.5px solid var(--vien);border-radius:13px;background:#fff;margin:8px 0}
input.so{width:100%;font:600 20px Arial;padding:11px;border:1.5px solid var(--vien);border-radius:12px;background:#fff}
.loi{color:#a3401f;font-size:14px;min-height:20px;text-align:center}
.muc{display:grid;gap:8px;margin-top:8px}
.muc button{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--vien);background:#fff;border-radius:13px;padding:12px 14px;font-size:17px;font-weight:600;color:var(--chu)}
.muc button small{color:var(--xanh);font-weight:600;font-size:14px}
.muc button.chon{border-color:var(--nau);background:#fbefe6}
.qrbox{background:#fff;border-radius:16px;padding:14px;margin:12px auto;max-width:300px;border:1px solid var(--vien)}
.qrbox svg,.qrbox img{width:100%;height:auto;display:block}
.ck{background:var(--the);border:1px solid var(--vien);border-radius:14px;padding:10px 14px;font-size:14.5px}
.ck div{display:flex;justify-content:space-between;gap:6px;padding:3px 0}
.ck b{text-align:right}
.lop{position:fixed;inset:0;background:rgba(28,26,23,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.tam{background:var(--nen);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.25)}
.tam .tien{font:700 34px/1.2 -apple-system,Roboto,Arial;margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c1a17;color:#fff;padding:10px 16px;border-radius:12px;font-size:14.5px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:20}
#toast.hien{opacity:1}
.chan{margin-top:24px;text-align:center;font-size:13px;color:var(--mo)}
</style>
</head>

let T = H.get('k') || '', TRA = H.get('tra') || '';
try { if (T) localStorage.setItem('giang-vi', T); else T = localStorage.getItem('giang-vi') || ''; } catch (e) {}
if (TRA && T) { try { history.replaceState(null, '', location.pathname + '#k=' + T); } catch (e) {} }

let app = null, auth = null, db = null, U = null;
const V = {the: null, cfg: null, tra: [], nap: [], unsub: [], man: 'vi', quet: null, chon: null, dangTra: ''};
function nap(src) { return new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('mạng')); document.head.appendChild(s); }); }
async function napFB() {
  const g = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  await nap(g + 'firebase-app-compat.js'); await nap(g + 'firebase-auth-compat.js'); await nap(g + 'firebase-firestore-compat.js');
  app = firebase.initializeApp(FB_CFG, 'vikhach'); auth = app.auth(); db = app.firestore();
}
function manLoi(t) { man(`<h2>Chưa mở được thẻ</h2><p>${esc(t)}</p><button class="b chinh" onclick="location.reload()">Thử lại</button>`); }

async function batDau() {
  if (!T) { man(`<h2>Chào bạn!</h2><p>Đây là trang kiểm tra thẻ thành viên GIANG Hair Salon.</p><p class="mo">Mở link hoặc quét mã QR do salon đưa cho bạn để xem thẻ.</p>`); return; }
  try { await napFB(); } catch (e) { manLoi('Không có mạng. Kiểm tra Wi-Fi / 4G rồi thử lại.'); return; }
  auth.onAuthStateChanged(async u => {
    if (!u) { try { await auth.signInAnonymously(); } catch (e) { manLoi(loi(e)); } return; }
    U = u; kiemPhien();
  });
}
async function kiemPhien() {
  try { const p = await db.collection('phienkhach').doc(U.uid).get(); if (p.exists && p.data().t === T) { vaoVi(); return; } } catch (e) {}
  let mo; try { mo = await db.collection('khachmo').doc(T).get(); } catch (e) { manLoi(loi(e)); return; }
  if (!mo.exists) { man(`<h2>Link này không còn dùng</h2><p>Salon đã cấp link mới cho thẻ của bạn (hoặc link bị gõ sai).</p><p class="mo">Hỏi lễ tân GIANG để nhận link mới nhé.</p>`); return; }
  manPin(!mo.data().coPin);
}

// ---- mã PIN 6 số
const SAI = {n: 0, den: 0}; try { Object.assign(SAI, JSON.parse(localStorage.getItem('giang-vi-sai') || '{}')); } catch (e) {}
const luuSai = () => { try { localStorage.setItem('giang-vi-sai', JSON.stringify(SAI)); } catch (e) {} };
function manPin(lanDau) {
  man(`<h2>${lanDau ? 'Tạo mã PIN cho thẻ' : 'Kiểm tra thẻ thành viên'}</h2>
    <p class="mo">${lanDau ? 'Đặt 6 số chỉ bạn biết. Lần sau máy này tự nhớ.' : 'Nhập <b>4 số cuối số điện thoại</b> của bạn để xem thẻ. Lần sau máy này tự nhớ.'}</p>
    <input class="pin" id="p1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="${lanDau ? 6 : 6}" autocomplete="off" placeholder="${lanDau ? '••••••' : '••••'}">
    ${lanDau ? '<input class="pin" id="p2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="nhập lại">' : ''}
    <div class="loi" id="ploi"></div>
    <button class="b chinh" id="pok">${lanDau ? 'Tạo mã PIN' : 'Xem thẻ'}</button>
    ${lanDau ? '' : '<p class="mo giua" style="margin-top:14px">Đổi số điện thoại hoặc không vào được? Nhắn lễ tân GIANG để được cấp link mới, số dư và quà tặng vẫn giữ nguyên.</p>'}`);
  const ok = async () => {
    const a = $('#p1').value.trim(), b = lanDau ? $('#p2').value.trim() : a, L = $('#ploi');
    if (lanDau ? !/^\d{6}$/.test(a) : !/^\d{4,6}$/.test(a)) { L.textContent = lanDau ? 'Mã PIN gồm đúng 6 chữ số' : 'Nhập 4 số cuối số điện thoại'; return; }
    if (lanDau && /^(\d)\1{5}$|^(012345|123456|234567|345678|456789|987654|654321)$/.test(a)) { L.textContent = 'Mã này dễ đoán quá, chọn 6 số khác nhé'; return; }
    if (a !== b) { L.textContent = 'Hai lần nhập không giống nhau'; return; }
    if (Date.now() < SAI.den) { L.textContent = `Nhập sai nhiều lần. Đợi ${Math.ceil((SAI.den - Date.now()) / 1000)} giây rồi thử lại`; return; }
    L.textContent = 'Đang kiểm tra…'; $('#pok').disabled = true;
    try {
      const h = await bam(a);
      if (lanDau) { const bt = db.batch(); bt.update(db.collection('khachpin').doc(T), {h}); bt.update(db.collection('khachmo').doc(T), {coPin: true});
        bt.set(db.collection('phienkhach').doc(U.uid), {t: T, h, luc: Date.now()}); await bt.commit(); }
      else await db.collection('phienkhach').doc(U.uid).set({t: T, h, luc: Date.now()});
      SAI.n = 0; SAI.den = 0; luuSai(); vaoVi();
    } catch (e) {
      $('#pok').disabled = false;
      if (e && e.code === 'permission-denied') {
        if (lanDau) { L.textContent = 'Thẻ này đã có mã PIN. Tải lại trang để nhập mã PIN.'; return; }
        SAI.n++; if (SAI.n >= 5) { SAI.den = Date.now() + 60000 * Math.pow(2, Math.min(5, SAI.n - 5)); } luuSai();
        L.textContent = 'Chưa đúng, kiểm tra lại 4 số cuối SĐT' + (SAI.n >= 3 ? ` (sai ${SAI.n} lần)` : ''); $('#p1').value = ''; $('#p1').focus();
      } else L.textContent = loi(e);
    }
  };
  $('#pok').onclick = ok; document.querySelectorAll('input.pin').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') ok(); });
  setTimeout(() => $('#p1').focus(), 80);
}

// ---- ví
function huyNghe() { V.unsub.forEach(f => { try { f(); } catch (e) {} }); V.unsub = []; }
function hetPhien() { huyNghe(); boQuet(); db.collection('phienkhach').doc(U.uid).delete().catch(() => {}); kiemPhien(); }
function vaoVi() {
  huyNghe(); V.man = 'vi'; man('<p class="mo giua" style="margin-top:30px">Đang tải thẻ…</p>');
  V.unsub.push(db.collection('khachapp').doc(T).onSnapshot(sn => { if (!sn.exists) { hetPhien(); return; } V.the = sn.data(); ve(); },
    e => { if (e && e.code === 'permission-denied') hetPhien(); else toast(loi(e)); }));
  V.unsub.push(db.collection('trasodu').where('t', '==', T).onSnapshot(sn => { V.tra = sn.docs.map(d => Object.assign({id: d.id}, d.data())); veTra(); }, () => {}));
  V.unsub.push(db.collection('napapp').where('t', '==', T).onSnapshot(sn => { V.nap = sn.docs.map(d => Object.assign({id: d.id}, d.data())).sort((a, b) => b.luc - a.luc); if (V.man === 'vi') ve(); }, () => {}));
  db.collection('khachcfg').doc('chung').get().then(d => { V.cfg = d.exists ? d.data() : null; if (V.man === 'vi') ve(); }).catch(() => {});
  clearInterval(vaoVi._t); vaoVi._t = setInterval(veTra, 5000);
}
function ve() {
  if (!V.the) return;
  if (V.man === 'qr') return veQR();
  if (V.man === 'nap') return veNap();
  const t = V.the, hap = num(t.hap), ph = num(t.ph), dungMay = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const napCho = V.nap.filter(x => x.tt === 'cho'), napXau = V.nap.filter(x => x.tt === 'tuchoi');
  man(`<div class="the"><div class="nho">THẺ THÀNH VIÊN GIANG</div><div class="ma">${esc(t.maThe || '')}</div>
      <div class="sodu">${fmtD(t.soDu)}</div><div class="nho">Số dư trong thẻ</div></div>
    <h3>Quà tặng trong thẻ</h3>
    <div class="hap"><span>Hấp tặng: <b>${hap}</b> lượt</span><span>${Array.from({length: Math.max(2, hap)}, (_, i) => `<i class="cham ${i < hap ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="hap"><span>Phục hồi tặng: <b>${ph}</b> lượt</span><span>${ph ? Array.from({length: ph}, () => '<i class="cham on"></i>').join('') : '<span class="mo">chưa có</span>'}</span></div>
    ${napCho.map(x => `<div class="bao">⏳ Đang chờ salon xác nhận khoản nạp <b>${fmtD(x.tien)}</b> (báo lúc ${ngayGio(x.luc)}). Salon kiểm tra tài khoản xong là tiền vào thẻ.<br><button class="lk" data-huynap="${esc(x.id)}">Huỷ báo nạp này</button></div>`).join('')}
    ${napXau.map(x => `<div class="bao xau">Salon chưa nhận được khoản nạp <b>${fmtD(x.tien)}</b> (${ngayGio(x.luc)}). Bạn kiểm tra lại giao dịch hoặc hỏi lễ tân nhé.<br><button class="lk" data-huynap="${esc(x.id)}">Đã hiểu</button></div>`).join('')}
    <div class="nut2"><button class="b chinh" id="bqr">Mã QR dùng quà</button><button class="b" id="bnap">Nạp tiền vào thẻ</button></div>
    <h3>Giao dịch gần đây</h3>
    ${(t.gd || []).length ? `<div class="gd">${t.gd.map(x => `<div><span>${LOAI[x.loai] || 'Giao dịch'}<small>${ngayGio(x.luc)}${num(x.thuong) ? ` · gồm ${fmtD(x.thuong)} tặng thêm` : ''}</small></span><span class="${num(x.tien) < 0 ? 'am' : 'duong'}">${num(x.tien) > 0 ? '+' : ''}${fmtD(x.tien)}</span></div>`).join('')}</div>` : '<p class="mo">Chưa có giao dịch nào.</p>'}
    <div class="chan">${dungMay ? '' : '<p>Lưu trang này lại để lần sau xem nhanh:<br>iPhone: nút Chia sẻ → <b>Thêm vào MH chính</b> · Android: ⋮ → <b>Thêm vào màn hình chính</b></p>'}
      <p>Trang chỉ có mã thẻ, số dư và quà tặng. Mọi khoản trừ tiền đều cần bạn bấm Đồng ý.</p>
      <button class="lk" id="bthoat">Thoát thẻ trên máy này</button></div>`);
  $('#bqr').onclick = () => { V.man = 'qr'; ve(); };
  $('#bnap').onclick = () => { V.man = 'nap'; V.chon = null; ve(); };
  $('#bthoat').onclick = async () => { if (!confirm('Thoát thẻ trên máy này? Lần sau phải nhập lại 4 số cuối SĐT.')) return; huyNghe(); try { await db.collection('phienkhach').doc(U.uid).delete(); } catch (e) {} kiemPhien(); };
  document.querySelectorAll('[data-huynap]').forEach(b => b.onclick = () => db.collection('napapp').doc(b.dataset.huynap).delete().catch(e => toast(loi(e))));
}

// ---- yêu cầu trả tiền từ quầy (hiện đè lên mọi màn hình)
function veTra() {
  const L = $('#lop'), now = Date.now();
  const x = V.tra.filter(r => (r.tt === 'cho' && num(r.het) > now) || r.id === V.dangTra).sort((a, b) => (a.id === TRA ? -1 : 0) || num(b.luc) - num(a.luc))[0];
  if (!x) { if (V.dangTra && !V.tra.some(r => r.id === V.dangTra)) { const truoc = V.duTruoc; V.dangTra = '';
      setTimeout(() => toast(num(V.the && V.the.soDu) < truoc ? 'Xong ✓ Đã thanh toán bằng số dư' : 'Quầy đã đóng yêu cầu, chưa trừ tiền'), 3000); }
    L.innerHTML = ''; return; }
  const ky = x.id + x.tt; if (L.dataset.ky === ky && L.innerHTML) return; L.dataset.ky = ky;
  const du = num(V.the && V.the.soDu), con = du - num(x.tien);
  L.innerHTML = `<div class="lop"><div class="tam">
    <div class="mo">GIANG Hair Salon đề nghị thanh toán</div><div class="tien">${fmtD(x.tien)}</div>
    <div class="mo">Số dư hiện tại ${fmtD(du)} → sau khi trả còn <b>${fmtD(con)}</b></div>
    ${x.tt === 'dongy' ? '<div class="bao" style="margin-top:12px">✓ Bạn đã đồng ý. Đang chờ quầy hoàn tất…</div>'
      : con < 0 ? '<div class="bao xau" style="margin-top:12px">Số dư không đủ. Báo lễ tân để trả cách khác nhé.</div><button class="b" style="margin-top:12px" data-tra="tuchoi">Đóng</button>'
      : `<button class="b xanh" style="margin-top:14px" data-tra="dongy">Đồng ý trả ${fmtD(x.tien)}</button><button class="b" data-tra="tuchoi">Không, tôi trả cách khác</button>`}
  </div></div>`;
  L.querySelectorAll('[data-tra]').forEach(b => b.onclick = async () => {
    b.disabled = true; const tt = b.dataset.tra;
    try { await db.collection('trasodu').doc(x.id).update({tt, luc2: Date.now()}); if (tt === 'dongy') { V.dangTra = x.id; V.duTruoc = du; } else { L.innerHTML = ''; toast('Đã báo quầy'); } }
    catch (e) { b.disabled = false; toast(e && e.code === 'permission-denied' ? 'Yêu cầu đã hết hạn' : loi(e)); }
  });
}

// ---- mã QR hấp tặng (đổi mỗi 2 phút)
function boQuet() { const q = V.quet; V.quet = null; if (q) { clearInterval(q.tm); db.collection('quetkhach').doc(q.code).delete().catch(() => {}); } }
async function taoQuet() {
  boQuet(); const code = taoMa(14), het = Date.now() + 150000;
  try { await db.collection('quetkhach').doc(code).set({t: T, maThe: V.the.maThe || '', hap: num(V.the.hap), ph: num(V.the.ph), het}); } catch (e) { toast(loi(e)); return; }
  V.quet = {code, het, tm: setInterval(() => { if (V.man !== 'qr') return boQuet(); const s = Math.round((het - Date.now()) / 1000), el = $('#qdem');
    if (s <= 5) { taoQuet(); return; } if (el) el.textContent = `Mã tự đổi sau ${s} giây`; }, 1000)};
  veQR();
}
function veQR() {
  if (!V.quet) { man('<p class="mo giua" style="margin-top:30px">Đang tạo mã…</p>'); taoQuet(); return; }
  const t = V.the;
  man(`<h2 class="giua">Mã QR dùng quà</h2><p class="mo giua">Đưa mã này cho nhân viên quét khi dùng buổi hấp hoặc phục hồi tặng.</p>
    <div class="qrbox">${qrSvg('GIANG-HAP:' + V.quet.code)}</div>
    <p class="giua">Thẻ <b>${esc(t.maThe || '')}</b> · hấp tặng <b>${num(t.hap)}</b> · phục hồi tặng <b>${num(t.ph)}</b></p><p class="mo giua" id="qdem"></p>
    <button class="b" id="bve">Quay lại thẻ</button>`);
  $('#bve').onclick = () => { V.man = 'vi'; boQuet(); ve(); };
}

// ---- nạp tiền
function veNap() {
  const c = V.cfg, t = V.the;
  if (!c || !c.bat || !c.stk) { man(`<h2>Nạp tiền</h2><p>Hiện salon chưa mở nạp tiền online. Bạn nạp trực tiếp tại quầy nhé.</p><button class="b" id="bve">Quay lại thẻ</button>`); $('#bve').onclick = () => { V.man = 'vi'; ve(); }; return; }
  const k = V.chon, noiDung = 'NAP ' + (t.maThe || '');
  const qr = k ? `https://img.vietqr.io/image/${encodeURIComponent(c.nganhang)}-${encodeURIComponent(c.stk)}-compact2.png?amount=${Math.round(k * 1000)}&addInfo=${encodeURIComponent(noiDung)}&accountName=${encodeURIComponent(c.tentk || '')}` : '';
  man(`<h2>Nạp tiền vào thẻ</h2><p class="mo">Chọn số tiền. Nạp đúng các mức dưới đây được tặng thêm.</p>
    <div class="muc">${(c.muc || []).map(m => `<button data-k="${num(m.tien)}" class="${k === num(m.tien) ? 'chon' : ''}"><span>${fmtD(m.tien)}</span>${num(m.thuong) ? `<small>tặng ${fmtD(m.thuong)}</small>` : ''}</button>`).join('')}</div>
    <p class="mo" style="margin-top:12px">Hoặc số khác (không có quà tặng):</p>
    <input class="so" id="sokhac" inputmode="numeric" placeholder="VD: 300.000" value="${k && !(c.muc || []).some(m => num(m.tien) === k) ? (k * 1000).toLocaleString('vi-VN') : ''}">
    ${k ? `<div class="qrbox"><img src="${esc(qr)}" alt="Mã QR chuyển khoản" referrerpolicy="no-referrer"></div>
      <div class="ck"><div><span>Ngân hàng</span><b>${esc(c.tenNH || '')}</b></div><div><span>Số tài khoản</span><b>${esc(c.stk)}</b></div><div><span>Chủ tài khoản</span><b>${esc(c.tentk || '')}</b></div>
        <div><span>Số tiền</span><b>${fmtD(k)}</b></div><div><span>Nội dung</span><b>${esc(noiDung)}</b></div></div>
      <p class="mo">Quét mã bằng app ngân hàng (hoặc chuyển tay đúng nội dung). Chuyển xong bấm nút dưới; salon kiểm tra tài khoản rồi cộng tiền vào thẻ.</p>
      <button class="b chinh" id="bdachuyen">Tôi đã chuyển khoản ${fmtD(k)}</button>` : ''}
    <button class="b" id="bve" style="margin-top:10px">Quay lại thẻ</button>`);
  document.querySelectorAll('.muc [data-k]').forEach(b => b.onclick = () => { V.chon = num(b.dataset.k); veNap(); });
  $('#sokhac').onchange = e => { const v = Math.round(num(String(e.target.value).replace(/\D/g, '')) / 1000); if (v < 10) { toast('Tối thiểu 10.000đ'); return; } if (v > 50000) { toast('Tối đa 50.000.000đ mỗi lần'); return; } V.chon = v; veNap(); };
  $('#bve').onclick = () => { V.man = 'vi'; ve(); };
  const bd = $('#bdachuyen'); if (bd) bd.onclick = async () => {
    bd.disabled = true;
    try { await db.collection('napapp').add({t: T, tien: k, luc: Date.now(), tt: 'cho'}); V.man = 'vi'; ve(); toast('Đã báo salon ✓ Tiền vào thẻ khi salon xác nhận'); }
    catch (e) { bd.disabled = false; toast(loi(e)); }
  };
}
window.addEventListener('hashchange', () => { if (/k=/.test(location.hash) && new URLSearchParams(location.hash.slice(1)).get('k') !== T) location.reload(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) boQuet(); else if (V.man === 'qr' && V.the) veQR(); });
batDau();
</script>
</body>
</html>
